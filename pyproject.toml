[project]
name = "comfyui-h3image-media-loader"
version = "1.0.0"
description = "Media loader for official MiniMax-H3-Image. Supports up to 16 reference images with drag-and-drop, crop, mirror, rotate, resize, and preset QoL. Separate from the Fantastic H3 video nodepack."
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["av"]

[project.urls]
Repository = "https://github.com/yourname/ComfyUI-H3Image-MediaLoader"

[tool.comfy]
PublisherId = "local"
DisplayName = "Fantastic H3-Image Media Loader (16 refs)"
requires-comfyui = ">=0.45.0"
